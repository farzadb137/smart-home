name: hub
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r hub/backend/requirements.txt
      - run: pip install -r tools/codegen/requirements.txt
      - run: python tools/codegen/generate.py
      - run: git diff --exit-code protocol/generated/
      - run: python -m pytest tests/test_protocol_contract.py -v
      - run: python -m compileall -q hub/backend/src/hub
