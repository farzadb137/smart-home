<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Smart Home</title>
	<link rel="stylesheet" href="css/style.css">
</head>
<body>
	<div class="app">
		<aside class="sidebar">
			<div class="brand">
				<span class="brand-icon">●</span>
				<span class="brand-name">My Home</span>
			</div>
			<nav class="sidebar-nav">
				<p class="nav-title">MENU</p>
				<ul>
					<li>
						<a href="#" class="nav-item active">
							<span class="nav-icon">⌂</span>
							<span>Overview</span>
						</a>
					</li>
					<li>
						<a href="#" class="nav-item">
							<span class="nav-icon">□</span>
							<span>Rooms</span>
						</a>
					</li>
					<li>
						<a href="#" class="nav-item">
							<span class="nav-icon">◇</span>
							<span>Devices</span>
						</a>
					</li>
				</ul>
				<p class="nav-title">SYSTEM</p>
				<ul>
					<li>
						<a href="#" class="nav-item">
							<span class="nav-icon">⚙</span>
							<span>Settings</span>
						</a>
					</li>
				</ul>
			</nav>
			<div class="sidebar-status">
				<span class="status-dot"></span>
				<div>
					<strong>Home</strong>
					<small>All systems normal</small>
				</div>
			</div>
		</aside>
		<main class="main-content">
			<header>
				<h2>Good Evening</h2>
			</header>
			<div class="dashboard-grid">
				<section class="card climate-card">
					<div class="card-header">
						<div>
							<p class="card-label">CLIMATE</p>
							<h2 class="climate-room">Living Room</h2>
						</div>
						<span class="status-badge">
							<span class="status-dot"></span>
							<span class="status-text">Online</span>
						</span>
					</div>
					<div class="temperature">
						<span class="temperature-value">22.5</span>
						<span class="temperature-unit">°C</span>
					</div>
					<div class="climate-details">
						<div class="detail">
				            <span class="detail-label">Temperature</span>
				            <span class="detail-value temperature-detail">22.5 °C</span>
				        </div>
				        <div class="detail">
				            <span class="detail-label">Last updated</span>
				            <span class="detail-value">Just now</span>
				        </div>
					</div>
				</section>
				<section class="card">
					<h2>Rooms</h2>
				</section>
				<section class="card devices-card">
					<div class="card-header">
						<div>
							<p class="card-label">DEVICES</p>
							<h2>Connected Devices</h2>
						</div>
					</div>
					<div class="devices-list"></div>
				</section>
				<section class="card">
					<h2>Activity</h2>
				</section>
			</div>
		</main>
	</div>
	<script type="module" src="js/app.js"></script>
</body>
</html>
