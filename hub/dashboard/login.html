<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in · SmartHome</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/components/auth.css">
</head>
<body class="auth-page">
    <main class="auth-shell">
        <section class="auth-card" aria-labelledby="login-title">
            <div class="auth-brand">
                <span class="auth-brand-icon" data-icon="brand"></span>
                <span>SmartHome</span>
            </div>

            <h1 class="auth-heading" id="login-title">Welcome back</h1>
            <p class="auth-subheading">Sign in to your smart home account</p>

            <form class="auth-form" id="login-form" novalidate>
                <div class="auth-field">
                    <label for="login-email">Username/Email address</label>
                    <div class="auth-input-wrap">
                        <span class="auth-input-icon" data-icon="mail"></span>
                        <input id="login-email" name="email" type="email" autocomplete="email" placeholder="Enter your username or email address" required>
                    </div>
                </div>

                <div class="auth-field">
                    <div class="auth-row">
                        <label for="login-password">Password</label>
                        <button type="button" class="auth-link" id="forgot-password">Forgot password?</button>
                    </div>
                    <div class="auth-input-wrap">
                        <span class="auth-input-icon" data-icon="lock"></span>
                        <input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
                        <button type="button" class="auth-password-toggle" data-password-toggle="login-password" aria-label="Show password">
                            <span data-icon="eye"></span>
                        </button>
                    </div>
                </div>

                <label class="auth-check">
                    <input type="checkbox" name="remember">
                    <span>Keep me signed in</span>
                </label>

                <div class="auth-message" id="login-message" role="alert"></div>

                <button class="auth-submit" type="submit" id="login-submit">
                    <span data-icon="user"></span>
                    <span>Sign in</span>
                </button>
            </form>

            <div class="auth-divider"><span>or</span></div>

            <a class="auth-secondary" href="admin-login.html">
                <span data-icon="shield"></span>
                <span>First-time administrator setup</span>
            </a>

            <div class="auth-security">
                <span data-icon="shield"></span>
                <span>Secure · Private · Your Home</span>
            </div>

            <p class="auth-footer">SmartHome Dashboard</p>
        </section>
    </main>

    <script type="module" src="js/auth-login.js"></script>
</body>
</html>
