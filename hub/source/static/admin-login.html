<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrator setup · SmartHome</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/components/auth.css">
</head>
<body class="auth-page">
    <main class="auth-shell is-admin">
        <section class="auth-card is-admin" aria-labelledby="admin-title">
            <div class="auth-brand">
                <span class="auth-brand-icon" data-icon="brand"></span>
                <span>SmartHome</span>
            </div>

            <h1 class="auth-heading" id="admin-title">Administrator setup</h1>
            <p class="auth-subheading">Create the first administrator account</p>

            <form class="auth-form" id="admin-form" novalidate>
                <div class="auth-field">
                    <label for="admin-name">Full name</label>
                    <div class="auth-input-wrap">
                        <span class="auth-input-icon" data-icon="user"></span>
                        <input id="admin-name" name="name" type="text" autocomplete="name" placeholder="Enter your full name" required minlength="2">
                    </div>
                </div>

                <div class="auth-field">
                    <label for="admin-email">Email address</label>
                    <div class="auth-input-wrap">
                        <span class="auth-input-icon" data-icon="mail"></span>
                        <input id="admin-email" name="email" type="email" autocomplete="email" placeholder="Enter your email address" required>
                    </div>
                </div>

                <div class="auth-field">
                    <label for="admin-password">Password</label>
                    <div class="auth-input-wrap">
                        <span class="auth-input-icon" data-icon="lock"></span>
                        <input id="admin-password" name="password" type="password" autocomplete="new-password" placeholder="Create a strong password" required minlength="8">
                        <button type="button" class="auth-password-toggle" data-password-toggle="admin-password" aria-label="Show password">
                            <span data-icon="eye"></span>
                        </button>
                    </div>
                </div>

                <div class="auth-field">
                    <label for="admin-confirm-password">Confirm password</label>
                    <div class="auth-input-wrap">
                        <span class="auth-input-icon" data-icon="lock"></span>
                        <input id="admin-confirm-password" name="confirmPassword" type="password" autocomplete="new-password" placeholder="Confirm your password" required minlength="8">
                        <button type="button" class="auth-password-toggle" data-password-toggle="admin-confirm-password" aria-label="Show password">
                            <span data-icon="eye"></span>
                        </button>
                    </div>
                </div>

                <div class="auth-message" id="admin-message" role="alert"></div>

                <button class="auth-submit is-admin" type="submit" id="admin-submit">
                    <span data-icon="shield"></span>
                    <span>Create administrator</span>
                </button>
            </form>

            <div class="auth-notice">
                <span data-icon="info"></span>
                <span>This account becomes the first owner of the smart home system. Additional users can be added later from Settings.</span>
            </div>

            <a class="auth-secondary" href="login.html" style="margin-top: 14px;">
                <span data-icon="arrow-left"></span>
                <span>Back to sign in</span>
            </a>

            <div class="auth-security">
                <span data-icon="shield"></span>
                <span>Secure · Private · Your Home</span>
            </div>
        </section>
    </main>

    <script type="module" src="js/auth-admin.js"></script>
</body>
</html>
