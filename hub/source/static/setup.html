<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Up Smart Hub</title>
    <link rel="stylesheet" href="css/fonts.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-wrap">
        <div class="card login-card setup-card">
            <p class="card-label">SMART HUB</p>
            <h2>Welcome to Smart Hub</h2>
            <p class="card-placeholder-note">Create the administrator account for this hub.</p>

            <form id="setup-form">
                <label for="username">Administrator username</label>
                <input type="text" id="username" autocomplete="username" maxlength="64" required>

                <label for="password">Password</label>
                <input type="password" id="password" autocomplete="new-password" minlength="8" required>

                <label for="confirm-password">Confirm password</label>
                <input type="password" id="confirm-password" autocomplete="new-password" minlength="8" required>

                <button class="detail-btn" type="submit">Create Administrator</button>
                <div class="login-error" id="error"></div>
            </form>
        </div>
    </div>

    <script>
        document.getElementById("setup-form").addEventListener("submit", async (event) => {
            event.preventDefault();
            const error = document.getElementById("error");
            error.textContent = "";

            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirm-password").value;

            if (password !== confirmPassword) {
                error.textContent = "Passwords do not match";
                return;
            }

            try {
                const response = await fetch("/api/setup", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        username,
                        password,
                        confirm_password: confirmPassword
                    })
                });
                const body = await response.json().catch(() => ({}));
                if (!response.ok) {
                    throw new Error(body.error || "Setup failed");
                }
                window.location.href = "/login";
            } catch (err) {
                error.textContent = err.message;
            }
        });
    </script>
</body>
</html>
